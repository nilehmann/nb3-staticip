# nb3-staticip inicio — generado por nb3-staticip-usb.py; no editar a mano
# Sala sin DHCP: con NB_NET_GW en nutellaboot.conf, esta entrada es la
# predeterminada. Pide la IP en la consola o la toma de static-ip.conf.
if [ -n "$NB_NET_GW" ]; then
	set default=staticip
	menuentry "@TITLE@ — IP fija" --id staticip {
		linux @LINUX@ nbgw=$NB_NET_GW nbmask=$NB_NET_MASK nbdns=$NB_NET_DNS nbnet=$NB_NET_PREFIX
		initrd @INITRD@ /nb3-staticip.cpio
	}
fi
# nb3-staticip fin
