# Tabla de IPs fijas por máquina (nb3-staticip).
#
# Una línea por máquina: la MAC de la placa de red cableada y su IP,
# separadas por espacios o TAB. Las líneas con # se ignoran.
#
# Se puede llenar a mano antes de ir a la sala: la MAC aparece en la pantalla
# al arrancar con la entrada "IP fija". Las IPs ingresadas por teclado se
# agregan solas a este archivo.
#
# aa:bb:cc:dd:ee:01    192.168.1.50
# aa:bb:cc:dd:ee:02    192.168.1.51
